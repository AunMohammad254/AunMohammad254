</defs>
<text x="8" y="66" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="900" fill="none" stroke="#00e5ff" stroke-width="1.6" opacity=".9">01</text>
<text x="150" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#f5f3ff" filter="url(#g)" textLength="200" lengthAdjust="spacingAndGlyphs">ABOUT_ME</text>
